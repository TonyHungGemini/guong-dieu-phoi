<div class="app" id="app">
  <div class="scrim" id="scrim" onclick="App.toggleSidebar(false)"></div>

  <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="17" fill="none" stroke="currentColor" stroke-width="2.2" opacity=".35"/><path d="M22 5v10M22 29v10M7 13.5l8.7 5M29.3 27.5l8.7 5M37 13.5l-8.7 5M14.7 27.5L6 32.5" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/><circle cx="22" cy="22" r="4.2" fill="currentColor"/></svg>
      </span>
      <span class="brand-text">
        <strong>GUỒNG</strong>
        <em>Bàn điều phối · Tổ quản trị</em>
      </span>
      <button class="icon-btn sidebar-close" onclick="App.toggleSidebar(false)" aria-label="Đóng menu"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>

    <div class="side-project">
      <div class="sp-top"><span class="micro">DỰ ÁN ĐANG CHẠY</span><span class="live-dot" title="Đang hoạt động"></span></div>
      <div class="sp-name">App Quản trị v1.0</div>
      <div class="sp-bar"><i id="sideProg" style="width:0%"></i></div>
      <div class="sp-meta"><span id="sideProgText">Đang tải…</span><span id="sideDays">—</span></div>
    </div>

    <nav class="nav">
      <div class="nav-label">Không gian</div>
      <button class="nav-item" data-view="dashboard" onclick="App.go('dashboard')">
        <svg class="ico"><use href="#i-grid"/></svg><span>Tổng quan</span>
      </button>
      <button class="nav-item" data-view="today" onclick="App.go('today')">
        <svg class="ico"><use href="#i-sun"/></svg><span>Hôm nay</span><span class="nav-badge" id="navTodayBadge" hidden>0</span>
      </button>
      <button class="nav-item" data-view="board" onclick="App.go('board')">
        <svg class="ico"><use href="#i-board"/></svg><span>Bảng việc</span>
      </button>
      <button class="nav-item" data-view="list" onclick="App.go('list')">
        <svg class="ico"><use href="#i-list"/></svg><span>Danh sách</span>
      </button>
      <button class="nav-item" data-view="calendar" onclick="App.go('calendar')">
        <svg class="ico"><use href="#i-calendar"/></svg><span>Lịch</span>
      </button>

      <div class="nav-label">Tổ đội</div>
      <button class="nav-item" data-view="team" onclick="App.go('team')">
        <svg class="ico"><use href="#i-users"/></svg><span>Đội ngũ</span>
      </button>
      <button class="nav-item" data-view="reports" onclick="App.go('reports')">
        <svg class="ico"><use href="#i-chart"/></svg><span>Báo cáo</span>
      </button>
    </nav>

    <div class="side-spacer"></div>

    <div class="side-milestone" id="sideMilestone" onclick="App.go('reports')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')App.go('reports')">
      <div class="sm-label"><svg class="ico"><use href="#i-flag"/></svg> Mốc kế tiếp</div>
      <div class="sm-title" id="sideMsTitle">Đang tải…</div>
      <div class="sm-meta" id="sideMsMeta">—</div>
    </div>

    <div class="side-foot">
      <div class="side-team">
        <div class="avatar-stack" id="sideTeamStack"></div>
        <span id="sideTeamText">Đội ngũ</span>
      </div>
      <button class="nav-item nav-settings" onclick="App.openSettings()">
        <svg class="ico"><use href="#i-settings"/></svg><span>Cài đặt &amp; dữ liệu</span>
      </button>
      <div class="side-hint"><kbd>⌘K</kbd> tìm nhanh <span>·</span> <kbd>N</kbd> việc mới</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" onclick="App.toggleSidebar()" aria-label="Mở menu"><svg class="ico"><use href="#i-menu"/></svg></button>
        <div class="crumb">
          <span class="crumb-brand">GUỒNG</span>
          <span class="crumb-sep">/</span>
          <span class="crumb-now" id="crumbNow">Tổng quan</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="search-trigger" onclick="App.openPalette()" aria-label="Tìm kiếm công việc">
          <svg class="ico"><use href="#i-search"/></svg>
          <span class="st-label">Tìm việc, người, mảng…</span>
          <kbd class="st-kbd">⌘K</kbd>
        </button>
        <button class="btn btn-accent btn-new" onclick="App.openTask()">
          <svg class="ico"><use href="#i-plus"/></svg><span>Giao việc</span>
        </button>
        <button class="icon-btn" id="themeBtn" onclick="App.toggleTheme()" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện">
          <svg class="ico" id="themeIcon"><use href="#i-moon"/></svg>
        </button>
        <button class="avatar avatar-me" id="meAvatar" onclick="App.openSettings()" title="Tài khoản & cài đặt">MA</button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="overlayRoot"></div>
<div id="toastRoot" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
<div id="confettiRoot" class="confetti-layer" aria-hidden="true"></div>

<script src="assets/data.js" defer></script>
<script src="assets/core.js" defer></script>
<script src="assets/views.js" defer></script>
<script src="assets/views2.js" defer></script>
<script src="assets/actions.js" defer></script>
</body>
